name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet "PyYAML>=6.0" "reportlab>=4.0" "build>=1.2"
      - run: python3 -m unittest discover -s tests

  build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet "PyYAML>=6.0" "reportlab>=4.0" "build>=1.2"
      - run: python3 -m build
      - run: python3 -m tools.scan_artifact dist/*.tar.gz dist/*.whl
