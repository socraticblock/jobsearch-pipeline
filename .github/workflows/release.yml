name: release

# Public-candidate release workflow.
#
# PUBLISHING: enabled via PyPI Trusted Publishing (OIDC). No API tokens are
# stored in GitHub. The PyPI project must list this repository/workflow as a
# trusted publisher (Project -> Publishing -> Add a new publisher) before the
# publish job can succeed. The publish job is gated on the `pypi` environment,
# which can require manual approval in the repo's Environments settings.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet "build>=1.2"
      - run: python3 -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  scan-sdist:
    name: scan built artifacts for the production deny-list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet "PyYAML>=6.0"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: python3 -m tools.scan_artifact dist/*.tar.gz dist/*.whl

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, scan-sdist]
    environment:
      name: pypi
      url: https://pypi.org/project/jobsearch-pipeline/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
