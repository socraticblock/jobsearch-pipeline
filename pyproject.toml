[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch-pipeline"
version = "1.0.1"
description = "Local-first job discovery and evidence-based shortlisting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Socraticblock"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]

[project.urls]
Homepage = "https://github.com/socraticblock/jobsearch-pipeline"
Repository = "https://github.com/socraticblock/jobsearch-pipeline"
Issues = "https://github.com/socraticblock/jobsearch-pipeline/issues"

[project.scripts]
jobsearch = "jobsearch.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["jobsearch*"]
namespaces = false